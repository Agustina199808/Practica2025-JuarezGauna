<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center text-info mb-4" style="font-family: fantasy;">Buscador de Cuentas</h1>

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/buscarCuenta}" method="get">
                    <div class="mb-3">
                        <label for="nCuenta" class="form-label">N° de CUENTA</label>
                        <input type="text" id="nCuenta" name="nCuenta" class="form-control" required>
                        <div class="form-text">Ingrese el N° de cuenta que desea buscar.</div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-info">Buscar Cuenta</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/listaCuentas}" class="btn btn-outline-secondary">Lista de cuentas</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
