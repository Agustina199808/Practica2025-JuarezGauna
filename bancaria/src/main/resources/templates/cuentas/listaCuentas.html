<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cuentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background-color: #f8f9fa;">
    <div class="container mt-5">
        <div class="card border-primary shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fa-solid fa-list"></i> Lista de Cuentas</h3>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>DNI</th>
                            <th>Nombre</th>
							<th>Apellido</th>
                            <th>N° CUENTA</th>
                            <th>SALDO ACTUAL</th>
                            <th>LIMITE EXTRACCION</th>
                            <th>ELIMINAR/MODIFICAR</th>
							<th>VER MOVIMIENTOS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cuenta : ${cuenta}">
                            <td th:text="${cuenta.cliente.id}"></td>
                            <td th:text="${cuenta.cliente.dni}"></td>
                            <td th:text="${cuenta.cliente.nombre}"></td>
							<td th:text="${cuenta.cliente.apellido}"></td>
                            <td th:text="${cuenta.numeroCuenta}"></td>
                            <td th:text="${cuenta.saldoActual}"></td>
                            <td th:text="${cuenta.limiteExtraccion}"></td>
                            <td>
								<a th:href="@{/eliminarCuenta/{id}(id=${cuenta.id})}" class="btn btn-danger btn-sm">
									<i class="fa-solid fa-trash"></i>
								</a>
                                <a th:href="@{/modificarCuenta/{id}(id=${cuenta.id})}" class="btn btn-warning btn-sm">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                            </td>
							<a >
								
							</a>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
