<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Búsqueda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4 text-info">Resultado de Búsqueda</h1>
        <div class="card border-success mb-3" th:if="${cliente != null}">
            <div class="card-header bg-info text-white">
                Cliente Encontrado
            </div>
            <div class="card-body">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>DNI</th>
                            <th>Nombre</th>
							<th>Apellido</th>
                            <th>Domicilio</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Eliminar/Modificar</th>
							<th>Crear cuenta</th>
							<th>Extraer/Depositar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td th:text="${cliente.id}"></td>
                            <td th:text="${cliente.dni}"></td>
                            <td th:text="${cliente.nombre}"></td>
							<td th:text="${cliente.apellido}"></td>
                            <td th:text="${cliente.domicilio}"></td>
                            <td th:text="${cliente.correoElec}"></td>
                            <td th:text="${cliente.estado}"></td>
							<td>
						    <a th:href="@{/eliminar/{id}(id=${cliente.id})}" class="btn btn-danger btn-sm">
							   <i class="fa-solid fa-trash"></i>
						    </a>
							<a th:href="@{/modificar/{dni}(dni=${cliente.dni})}" class="btn btn-warning btn-sm">
							  <i class="fa-solid fa-pen-to-square"></i>
							</a>
							</td>
							<td>
							<a th:href="@{/altaCuenta/{dni}(dni=${cliente.dni})}" class="btn btn-warning btn-sm">
							  <i class="fa-solid fa-pen-to-square"></i>
							</a>
							</td>
							<td>
							<a th:href="@{/altaCuenta/{dni}(dni=${cliente.dni})}" class="btn btn-warning btn-sm">
							  <i class="fa-solid fa-pen-to-square"></i>
							</a>
							<a th:href="@{/altaCuenta/{dni}(dni=${cliente.dni})}" class="btn btn-warning btn-sm">
							  <i class="fa-solid fa-pen-to-square"></i>
							</a>
							</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="alert alert-danger text-center" role="alert" th:unless="${cliente != null}">
            Cliente no encontrado.
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
