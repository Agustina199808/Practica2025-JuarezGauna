<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center text-info mb-4" style="font-family: fantasy;">Buscador de Clientes</h1>

        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/buscar}" method="get">
                    <div class="mb-3">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" id="dni" name="dni" class="form-control" required>
                        <div class="form-text">Ingrese el DNI del cliente que desea buscar.</div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-info">Buscar Cliente</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/listaClientes}" class="btn btn-outline-secondary">Lista de clientes</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
