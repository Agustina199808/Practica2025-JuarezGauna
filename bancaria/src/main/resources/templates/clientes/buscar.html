<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Cliente</title>
    </head>
<body>
    <h1>Buscador de Cliente</h1>

    <form">
        <div>
            <label for="dni">DNI:</label>
            <input type="text" id="dni" name="dni" required="required" placeholder="Ingrese el DNI"/>
            <small>Ingrese el DNI del cliente que desea buscar.</small>
        </div>
        <br/>
        <button type="submit">Buscar Cliente</button>
    </form>

    <br/>
    <a th:href="@{/clientes/listaClientes}">Lista de clientes</a>
</body>
</html>
