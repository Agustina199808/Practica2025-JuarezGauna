<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background-color: #f8f9fa;">

    <div class="container mt-5">
        <div class="card border-primary shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fa-solid fa-list"></i> Lista de Clientes</h3>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>DNI</th>
                            <th>Nombre</th>
							<th>Apellido</th>
                            <th>Domicilio</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Eliminar/Modificar </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="cliente : ${cliente}">
                            <td th:text="${cliente.id}"></td>
                            <td th:text="${cliente.dni}"></td>
                            <td th:text="${cliente.nombre}"></td>
							<td th:text="${cliente.apellido}"></td>
                            <td th:text="${cliente.domicilio}"></td>
                            <td th:text="${cliente.correoElec}"></td>
                            <td th:text="${cliente.estado}"></td>
                            <td>
                                <form th:action="@{/eliminarCliente}" method="post" style="display:inline;">
                                    <input type="hidden" name="id" th:value="${cliente.id}" />
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                                <a th:href="@{/modificar/{dni}(dni=${cliente.dni})}" class="btn btn-warning btn-sm">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
